# Minimal Gateway API example, verified working on this cluster.
#
#   kubectl apply -f manifests/example-gateway.yaml
#   kubectl get gateway main            # ADDRESS comes from the Cilium LB pool
#   curl http://<address>/
#
# Coming from Istio, the mapping is close to 1:1:
#   Istio Gateway        -> Gateway
#   Istio VirtualService -> HTTPRoute
#
# The Gateway gets a LoadBalancer Service, so LB IPAM assigns an address from
# ingress-pool (10.100.9.0/24) and Cilium's L2 announcement policy ARPs for it.
# Point the router's 80/443 DNAT at that address to expose it to the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: default
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Widen to `All` (plus a ReferenceGrant) to route to other namespaces.
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-test
  namespace: default
spec:
  parentRefs:
    - name: main
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lb-test
          port: 80
